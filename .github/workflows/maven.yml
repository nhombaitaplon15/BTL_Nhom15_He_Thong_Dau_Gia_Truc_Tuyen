name: Java CI with Maven

# Kịch bản này chạy khi bạn PUSH code hoặc tạo Pull Request vào nhánh chính
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================================
  # JOB 1: BUILD + TEST (CI)
  # ============================================================
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code từ repo của bạn đưa vào máy ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Java 21 (Khớp với dự án của bạn)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Chạy lệnh Maven để Build và chạy toàn bộ Unit Test
      - name: Build and Test with Maven
        run: mvn -B clean verify

      # 4. Publish kết quả test lên GitHub Actions tab
      #    Dù pass hay fail đều hiện báo cáo (if: always())
      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Results
          path: '**/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false
  # ============================================================
  # JOB 2: DEPLOY (CD) — chỉ chạy khi Job 1 pass VÀ đang ở main
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: auction-app
          path: target/Demo-1.0-SNAPSHOT.jar